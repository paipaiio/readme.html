<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --accent: #2563eb;
      --accent-soft: #e8f0ff;
      --code-bg: #111827;
      --code-text: #f8fafc;
      --warn-bg: #fff7ed;
      --warn-line: #fdba74;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    a { color: var(--accent); }
    .doc-shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 24px 18px;
    }
    .brand h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }
    .brand p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
    }
    .toc {
      margin-top: 22px;
      display: grid;
      gap: 6px;
    }
    .toc a {
      display: block;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
    }
    .toc a:hover,
    .toc a.active {
      background: var(--accent-soft);
      color: var(--accent);
    }
    .content {
      min-width: 0;
      padding: 28px;
    }
    .topbar {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .search {
      width: min(360px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      background: var(--panel);
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab-button,
    .copy-button,
    .page-button,
    .seg-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      cursor: pointer;
    }
    .tab-button.active,
    .page-button.active,
    .seg-button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .tab-panel,
    .page {
      display: none;
    }
    .tab-panel.active,
    .page.active {
      display: block;
    }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .section h2,
    .section h3 {
      margin-top: 0;
      line-height: 1.25;
    }
    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 14px;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .code-block {
      position: relative;
      margin: 14px 0;
    }
    pre {
      margin: 0;
      overflow: auto;
      border-radius: 8px;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 16px;
    }
    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 0.92em;
    }
    .copy-button {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: #111827;
      font-size: 12px;
      padding: 5px 8px;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--panel);
    }
    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    th { background: #f3f5f9; }
    .notice {
      border: 1px solid var(--warn-line);
      background: var(--warn-bg);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 16px;
    }
    .param-demo {
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }
    .controls {
      display: grid;
      gap: 12px;
    }
    .control label {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }
    .control input,
    .control select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px 10px;
      font: inherit;
      background: #fff;
    }
    .segmented {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .hidden-by-search {
      display: none !important;
    }

    @media (max-width: 860px) {
      .doc-shell { grid-template-columns: 1fr; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .content { padding: 18px; }
      .topbar { align-items: stretch; flex-direction: column; }
      .param-demo { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="doc-shell">
    <aside class="sidebar">
      <div class="brand">
        <h1>{{DOCUMENT_TITLE}}</h1>
        <p>{{DOCUMENT_SUBTITLE}}</p>
      </div>
      <nav class="toc" aria-label="目录">
        {{TOC_LINKS}}
      </nav>
    </aside>

    <main class="content">
      <div class="topbar">
        <div class="tag-row">{{GLOBAL_TAGS}}</div>
        <input class="search" id="docSearch" type="search" placeholder="搜索文档内容">
      </div>

      <div class="tabs" role="tablist">
        {{TAB_BUTTONS}}
      </div>

      {{TAB_PANELS}}
    </main>
  </div>

  <script>
    const activateTab = (name) => {
      document.querySelectorAll("[data-tab-button]").forEach((button) => {
        button.classList.toggle("active", button.dataset.tabButton === name);
      });
      document.querySelectorAll("[data-tab-panel]").forEach((panel) => {
        panel.classList.toggle("active", panel.dataset.tabPanel === name);
      });
    };

    document.querySelectorAll("[data-tab-button]").forEach((button) => {
      button.addEventListener("click", () => activateTab(button.dataset.tabButton));
    });

    document.querySelectorAll("[data-page-button]").forEach((button) => {
      button.addEventListener("click", () => {
        const group = button.dataset.pageGroup;
        const page = button.dataset.pageButton;
        document.querySelectorAll(`[data-page-group="${group}"]`).forEach((item) => {
          item.classList.toggle("active", item.dataset.pageButton === page || item.dataset.page === page);
        });
      });
    });

    document.querySelectorAll("[data-copy-target]").forEach((button) => {
      button.addEventListener("click", async () => {
        const target = document.querySelector(button.dataset.copyTarget);
        const text = target ? target.innerText : "";
        await navigator.clipboard.writeText(text);
        const original = button.textContent;
        button.textContent = "已复制";
        setTimeout(() => { button.textContent = original; }, 1200);
      });
    });

    const searchInput = document.getElementById("docSearch");
    if (searchInput) {
      searchInput.addEventListener("input", () => {
        const query = searchInput.value.trim().toLowerCase();
        document.querySelectorAll(".section").forEach((section) => {
          const matched = !query || section.innerText.toLowerCase().includes(query);
          section.classList.toggle("hidden-by-search", !matched);
        });
      });
    }

    const updateDemoPreview = () => {
      const preview = document.getElementById("paramPreview");
      if (!preview) return;
      const port = document.getElementById("demoPort")?.value || "3000";
      const mode = document.querySelector("[data-demo-mode].active")?.dataset.demoMode || "development";
      const apiBase = document.getElementById("demoApiBase")?.value || "http://localhost:3000";
      preview.textContent = [
        `APP_MODE=${mode}`,
        `PORT=${port}`,
        `API_BASE_URL=${apiBase}`,
        "JWT_SECRET=replace-with-a-secure-secret"
      ].join("\n");
    };

    document.querySelectorAll("[data-demo-mode]").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-demo-mode]").forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        updateDemoPreview();
      });
    });
    document.querySelectorAll("[data-demo-input]").forEach((input) => {
      input.addEventListener("input", updateDemoPreview);
    });
    updateDemoPreview();
  </script>
</body>
</html>
